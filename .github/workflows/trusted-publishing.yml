name: Trusted publishing

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/release/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/RELEASING.md'
      - 'docs/releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-publishing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_TEST_THREADS: '2'

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Check the intended CI workflow for the exact tagged commit.
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
      crates: ${{ steps.gate.outputs.crates }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Evaluate release requirements
        id: gate
        run: python3 scripts/release/pipeline.py gate
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    needs: gate
    if: >-
      needs.gate.outputs.publish == 'true' &&
      github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write # Delegated only on tag pushes; nested signer uses OIDC.
      attestations: write # Retain provenance for this builder output only.
    uses: ./.github/workflows/build-binaries.yml # zizmor: ignore[self-repository] fixed local caller revision
    with:
      version: ${{ needs.gate.outputs.version }}
      publish: ${{ needs.gate.outputs.publish == 'true' }}

  build-dry-run:
    name: Build unsigned dry run
    needs: gate
    if: needs.gate.outputs.publish != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries-core.yml # zizmor: ignore[self-repository] fixed local caller revision
    with:
      version: ${{ needs.gate.outputs.version }}

  publish-path-check:
    name: Publish path (dry run)
    needs: [gate, build-dry-run]
    if: needs.gate.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Reproduce the candidate without compiling or authenticating
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          RUST_VERSION: ${{ needs.build-dry-run.outputs.rust-version }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          python3 scripts/release/pipeline.py repackage --directory "$RUNNER_TEMP/release-artifacts" --version "$VERSION" --rust-version "$RUST_VERSION"
      - name: Known-good registry fixture comparison (irig106-types 0.1.0)
        run: python3 scripts/release/pipeline.py known-good
      - name: Verify all historical release layouts without retroactive claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/pipeline.py legacy

  publish:
    name: Publish to crates.io
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Exchange a fresh short-lived crates.io token for this wave.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ needs.gate.outputs.version }}{,-attestations}
          merge-multiple: true
          path: ${{ runner.temp }}/release-artifacts
      - name: Verify provenance, repackage without compiling, compare existing versions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          VERSION: ${{ needs.gate.outputs.version }}
          RUST_VERSION: ${{ needs.build.outputs.rust-version }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          python3 scripts/release/pipeline.py prepare --directory "$RUNNER_TEMP/release-artifacts" --version "$VERSION" --rust-version "$RUST_VERSION"
      - name: Fresh OIDC credential for the single-crate publish wave
        if: steps.prepare.outputs.upload == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish without compiling
        if: steps.prepare.outputs.upload == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RUST_VERSION: ${{ needs.build.outputs.rust-version }}
        run: cargo +"$RUST_VERSION" publish --locked --no-verify --registry crates-io
      - name: Compare served bytes and registry checksum (new or existing version)
        env:
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release/pipeline.py registry --directory "$RUNNER_TEMP/release-artifacts" --version "$VERSION"

  github-release:
    name: GitHub release
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'true' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Retain frozen release assets; never replace existing bytes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ needs.gate.outputs.version }}{,-attestations}
          merge-multiple: true
          path: ${{ runner.temp }}/release-artifacts
      - name: Verify provenance and retain immutable evidence with committed notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release/pipeline.py github-release --directory "$RUNNER_TEMP/release-artifacts" --version "$VERSION"

  verify:
    name: Verify publication
    needs: [gate, github-release]
    if: needs.gate.outputs.publish == 'true' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ needs.gate.outputs.version }}{,-attestations}
          merge-multiple: true
          path: ${{ runner.temp }}/release-artifacts
      - name: Verify actual release files, registry identity, attestations and docs.rs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release/pipeline.py verify --directory "$RUNNER_TEMP/published-artifacts" --version "$VERSION"

  verify-windows:
    name: Smoke-test published Windows archive and installed crate
    needs: [gate, build, github-release]
    if: >-
      needs.gate.outputs.publish == 'true' &&
      github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.build.outputs.rust-version }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Download and verify published archive, then smoke-test outside checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
          VERSION: ${{ needs.gate.outputs.version }}
          RUST_VERSION: ${{ needs.build.outputs.rust-version }}
        run: |
          python scripts/release/pipeline.py download --directory "$RUNNER_TEMP/published-artifacts" --version "$VERSION"
          python scripts/release/pipeline.py signatures --directory "$RUNNER_TEMP/published-artifacts" --version "$VERSION"
          python scripts/release/pipeline.py smoke --directory "$RUNNER_TEMP/published-artifacts" --version "$VERSION"
          python scripts/release/pipeline.py install --version "$VERSION" --rust-version "$RUST_VERSION"
